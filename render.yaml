# Blueprint do Render.com — https://render.com/docs/blueprint-spec
# Pra usar:
#   1. Push desse arquivo pro GitHub
#   2. No Render:  New  ->  Blueprint  ->  aponta pro repo
#   3. Ele detecta esse render.yaml e configura tudo sozinho

services:
  - type: web
    name: ecommerce-yesod
    runtime: docker
    region: oregon          # free tier mais comum; ou "virginia", "frankfurt", "singapore"
    plan: free              # sempre gratis, mas dorme apos 15min sem request
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /status
    autoDeploy: true        # faz deploy toda vez que push no branch
    branch: main
    envVars:
      - key: YESOD_HOST
        value: "*4"
      - key: YESOD_SQLITE_DATABASE
        # ATENCAO: no plano FREE o disco nao eh persistente — SQLite zera a cada deploy.
        # Pra persistir precisaria plano pago com disco (ou migrar pra PostgreSQL).
        value: /tmp/ecommerce-yesod.sqlite3
